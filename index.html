<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HNL Prognoza</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f6fa;
      color:#172033;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif

    button,input{font:inherit}

    .app{
      max-width:1050px;

    header{
      display:flex;

      align-items:center;

    .brand{

      gap:12px
    }

    .match h3{
      margin:7px 0 15px
    }

    .match small,
    .match label{
      display:block;
      color:#718097;
      font-size:13px
    }

    .match label{
      margin-top:12px;
      font-weight:700
    }

    .score{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:6px
    }

    .score input,
    .admin-score{
      width:62px;
      padding:9px;
      border:1px solid #cbd3df;
      border-radius:8px;
      font-size:18px
    }

    .outcomes{
      display:flex;
      gap:6px;
      margin:7px 0 13px
    }

    .outcomes button{
      flex:1;
      border:0;
      border-radius:8px;
      padding:10px;
      background:#e7ebf2;

    .outcomes button.selected{

      outline:2px solid #5b80d3

    .wide{

      padding:11px;
      border:0;
      border-radius:9px;

    .login{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px

    .login-card{
      width:min(380px,100%);

      padding:28px;
      border-radius:18px;
      box-shadow:0 10px 35px rgba(20,30,50,.1);
      text-align:center
    }

    .login-card input{
      width:100%;
      padding:12px;
      margin:5px 0;
      border:1px solid #cbd3df;
      border-radius:9px
    }

    .error{
      color:#a22;
      margin-top:10px
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#18233a;
      color:white;
      padding:12px 15px;
      border-radius:10px;
      z-index:9999
    }

    table{
      width:100%;
      border-collapse:collapse
    }

    th,td{
      text-align:left;
      padding:11px 8px;
      border-bottom:1px solid #edf0f4
    }

    .admin-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px
    }

    .loading{
      text-align:center;
      padding:40px
    }

    .password-box{
      max-width:500px;
      margin:30px auto
    }

    .password-box input{
      width:100%;
      padding:12px;
      margin:6px 0;
      border:1px solid #cbd3df;
      border-radius:9px
    }

    .notice{
      background:#fff6d8;
      border:1px solid #ecd27a;
      color:#624d00;
      padding:12px;
      border-radius:10px;
      margin-bottom:14px
    }

    .player-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid #edf0f4
    }

    .rank{
      font-size:20px;
      font-weight:800;
      width:45px
    }

    .player-name{
      flex:1
    }

    .total-points{
      font-size:20px;
      font-weight:800
    }

    .muted{
      color:#778196
    }

    @media(max-width:700px){

      .grid{
        grid-template-columns:1fr
      }

      .hero,
      .admin-row{
        flex-direction:column;
        align-items:flex-start
      }

      .app{
        padding:12px
      }

      table{
        font-size:14px
      }

      .player-row{
        padding:10px 0
      }
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://tiumqykmnatvdljbfcwr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_egI9OFlNjMyq0q6p3R4uLw_AqTRLh6T";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   POČETNI BODOVI
   ===================================================== */

const START = {

  "Gogi":23,
  "Velin":21,
  "Nikša":21,
  "Toni":18,
  "Igor":13,
  "Danijel":8,
  "Bojan":4

};


/* =====================================================
   POMOĆNE FUNKCIJE
   ===================================================== */

const $ =
  id => document.getElementById(id);


function outcome(home,away){

  if(home > away)
    return "1";

  if(home < away)
    return "2";

  return "X";
}


function points(pred,match){

  if(
    !pred ||
    match.actual_home_score === null ||
    match.actual_away_score === null
  ){
    return 0;
  }

  let p = 0;


  /* TOČAN REZULTAT */

  if(
    Number(pred.predicted_home_score) ===
      Number(match.actual_home_score) &&

    Number(pred.predicted_away_score) ===
      Number(match.actual_away_score)
  ){
    p += 3;
  }


  /* TOČAN ISHOD */

  if(
    pred.predicted_outcome ===
      outcome(
        Number(match.actual_home_score),
        Number(match.actual_away_score)
      )
  ){
    p += 1;
  }


  return p;
}


function toast(message){

  const x =
    document.createElement("div");

  x.className="toast";

  x.textContent=message;

  document.body.appendChild(x);

  setTimeout(
    ()=>x.remove(),
    2500
  );
}


/* =====================================================
   LOGIN
   ===================================================== */

function showLogin(){

  document.body.innerHTML = `

    <main class="login">

      <form
        class="login-card"
        id="loginForm"
      >

        <div style="font-size:42px">
          🏆
        </div>

        <h1>
          HNL Prognoza
        </h1>

        <p>
          Prijava igrača
        </p>

        <input
          id="username"
          placeholder="Korisničko ime"
          autocomplete="username"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Lozinka"
          autocomplete="current-password"
          required
        >

        <button
          class="primary wide"
          type="submit"
        >
          PRIJAVI SE
        </button>

        <div id="loginError"></div>

      </form>

    </main>

  `;


  $("loginForm").onsubmit =
    async e => {

      e.preventDefault();

      $("loginError").innerHTML="";


      const username =
        $("username")
          .value
          .trim()
          .toLowerCase();


      const password =
        $("password").value;


      const email =
        username + "@hnl.local";


      const {error} =
        await supabase.auth.signInWithPassword({

          email,
          password

        });


      if(error){

        $("loginError").innerHTML = `

          <p class="error">
            Neispravno korisničko ime ili lozinka.
          </p>

        `;

        return;
      }


      location.reload();

    };

}


/* =====================================================
   APLIKACIJA
   ===================================================== */

async function startApp(user){

  document.body.innerHTML = `

    <div class="app">

      <header>

        <div>

          <div class="brand">
            🏆 HNL Prognoza
          </div>

          <span
            class="sub"
            id="subtitle"
          >
            Učitavanje...
          </span>

        </div>


        <div class="nav">

          <button id="navPred">
            Prognoze
          </button>

          <button id="navRes">
            Rezultati
          </button>

          <button id="navTable">
            Poredak
          </button>

          <button
            id="navAdmin"
            style="display:none"
          >
            Admin
          </button>

          <button id="logout">
            Odjava
          </button>

        </div>

      </header>


      <div id="content"></div>

    </div>

  `;


  /* ===================================================
     PROFIL
     =================================================== */

  const profileResult =
    await supabase
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  const profile =
    profileResult.data;


  if(!profile){

    $("content").innerHTML = `

      <div class="card">

        <h2>
          Profil nije pronađen
        </h2>

        <p>
          Igrač nema odgovarajući profil.
        </p>

      </div>

    `;

    return;
  }


  $("subtitle").textContent =
    `Korisnik: ${profile.name}`;


  if(profile.is_admin){

    $("navAdmin").style.display =
      "block";

  }


  $("logout").onclick =
    async ()=>{

      await supabase.auth.signOut();

      location.reload();

    };


  /* ===================================================
     PROMJENA LOZINKE
     =================================================== */

  async function showChangePassword(){

    $("content").innerHTML = `

      <div class="card password-box">

        <h2>
          🔑 Promjena lozinke
        </h2>

        <div class="notice">

          Administrator je resetirao tvoju lozinku.
          Prije nastavka moraš postaviti novu lozinku.

        </div>


        <form id="changePasswordForm">

          <label>
            Nova lozinka
          </label>

          <input
            id="newPassword"
            type="password"
            minlength="6"
            required
            placeholder="Nova lozinka"
          >


          <label>
            Ponovi novu lozinku
          </label>

          <input
            id="newPassword2"
            type="password"
            minlength="6"
            required
            placeholder="Ponovi novu lozinku"
          >


          <button
            class="primary wide"
            type="submit"
          >
            SPREMI NOVU LOZINKU
          </button>


          <div id="passwordError"></div>

        </form>

      </div>

    `;


    $("changePasswordForm").onsubmit =
      async e => {

        e.preventDefault();


        const p1 =
          $("newPassword").value;

        const p2 =
          $("newPassword2").value;


        if(p1.length < 6){

          $("passwordError").innerHTML = `

            <p class="error">
              Lozinka mora imati najmanje 6 znakova.
            </p>

          `;

          return;
        }


        if(p1 !== p2){

          $("passwordError").innerHTML = `

            <p class="error">
              Lozinke se ne podudaraju.
            </p>

          `;

          return;
        }


        const {error} =
          await supabase.auth.updateUser({

            password:p1

          });


        if(error){

          $("passwordError").innerHTML = `

            <p class="error">
              ${error.message}
            </p>

          `;

          return;
        }


        /*
          Nakon uspješne promjene pokušavamo
          označiti profil kao riješen.
        */

        await supabase
          .from("profiles")
          .update({
            must_change_password:false
          })
          .eq("id",user.id);


        toast(
          "Lozinka uspješno promijenjena ✓"
        );


        location.reload();

      };

  }


  /* ===================================================
     PODACI AKTIVNOG KOLA
     =================================================== */

  let round = null;

  let matches = [];

  let predictions = {};


  async function loadData(){

    const r =
      await supabase
        .from("rounds")
        .select("*")
        .eq("is_finished",false)
        .order(
          "round_number",
          {
            ascending:true
          }
        )
        .limit(1)
        .maybeSingle();


    round =
      r.data;


    if(round){

      const m =
        await supabase
          .from("matches")
          .select("*")
          .eq("round_id",round.id)
          .order("kickoff_at");


      matches =
        m.data || [];

    }else{

      matches=[];

    }


    const p =
      await supabase
        .from("predictions")
        .select("*")
        .eq("user_id",user.id);


    predictions={};


    (p.data || [])
      .forEach(x=>{

        predictions[x.match_id]=x;

      });

  }


  /* ===================================================
     PROGNOZE
     =================================================== */
