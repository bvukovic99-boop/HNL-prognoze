<script type="module">

/* =========================================
   POČETNI BODOVI
========================================= */

const START={
  "Gogi":32,
  "Nikša":27,
  "Velin":26,
  "Toni":21,
  "Igor":19,

let matches=[];

let profiles=[];
let currentPage="predictions";


/* =========================================
   POMOĆNE FUNKCIJE
========================================= */

function esc(v){

  return String(v??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


function toast(msg){

  const x=
    document.getElementById("toast");

  x.textContent=msg;

  x.classList.remove("hidden");

  clearTimeout(window.__toast);

  window.__toast=
    setTimeout(
      ()=>x.classList.add("hidden"),
      2800
    );

}


function locked(){

  return !!round?.locked_at &&
    new Date(round.locked_at)<=new Date();

}


function fmtDate(s){

  if(!s)return "-";

  return new Date(s).toLocaleString(
    "hr-HR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function inputDate(s){

  if(!s)return "";

  const d=new Date(s);

  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function inputTime(s){

  if(!s)return "";

  const d=new Date(s);

  const h=String(d.getHours()).padStart(2,"0");
  const m=String(d.getMinutes()).padStart(2,"0");

  return `${h}:${m}`;

}


function toISO(date,time){

  if(!date||!time)
    return null;

  const d=
    new Date(
      `${date}T${time}:00`
    );

  if(Number.isNaN(d.getTime()))
    return null;

  return d.toISOString();

}


function lockFromKickoffs(items){

  const times=
    items
      .map(x=>new Date(x))
      .filter(x=>!Number.isNaN(x.getTime()));

  if(!times.length)
    return null;

  const earliest=
    Math.min(
      ...times.map(x=>x.getTime())
    );

  return new Date(
    earliest-
    2*60*60*1000
  ).toISOString();

}


function nameById(id){

  const p=
    profiles.find(
      x=>x.id===id
    );

  return p?.name||"Igrač";

}


/*
  Izračun bodova za već spremljeni stvarni rezultat.

  3 boda = točan rezultat
  1 bod  = točan ishod
  ukupno = 4 ako su oba točna

  Ovo služi samo za PRIVREMENI prikaz
  prije završetka kola.

  Baza se ne mijenja dok admin ne
  klikne "Obračunaj i završi kolo".
*/

function calculatePoints(
  predictedHome,
  predictedAway,
  predictedOutcome,
  actualHome,
  actualAway
){

  if(
    actualHome==null ||
    actualAway==null
  ){

    return null;

  }


  const exact=
    Number(predictedHome)===
      Number(actualHome) &&
    Number(predictedAway)===
      Number(actualAway);


  const actualOutcome=
    Number(actualHome)>
      Number(actualAway)
      ?"1"
      :
    Number(actualHome)<
      Number(actualAway)
      ?"2"
      :"X";


  const outcomeCorrect=
    predictedOutcome===
    actualOutcome;


  return(
    (exact?3:0)+
    (outcomeCorrect?1:0)
  );

}


/* =========================================
   LOGIN
========================================= */

function loginView(message=""){

  document.getElementById("root").innerHTML=`

  <div class="login">

    <form class="login-card" id="loginForm">

      <div style="font-size:42px">🏆</div>

      <h1>HNL Prognoza</h1>

        Prognoziraj utakmice SuperSport HNL-a.
      </p>

      ${

      <label>Korisničko ime</label>

        autocomplete="username"
        placeholder="npr. Bojan"
        required
      >

      <label>Lozinka</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <div class="actions">

        <button
          class="btn primary"
          style="width:100%"
        >
          Prijava
        </button>

      </div>

    </form>

  </div>

  `;


  document

}


async function login(e){

  e.preventDefault();

  const username=
    document
      .getElementById("username")
      .value
      .trim()
      .toLowerCase();


  const password=
    document
      .getElementById("password")
      .value;


  const email=
    username.endsWith("@hnl.local")
      ?username
      :username+"@hnl.local";


  const {
    data,
    error
  }=
    await supabase.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    loginView(error.message);

    return;

  }


  await start(data.user);

}


/* =========================================
   START APLIKACIJE
========================================= */

async function start(u){

  user=u;


  const {
    data:p,
    error
  }=
    await supabase
      .from("profiles")
      .select("*")
      .eq("id",u.id)
      .maybeSingle();


  if(error||!p){

    loginView(
      "Greška pri učitavanju profila."
    );

    return;

  }


  profile=p;


  try{

    await loadData();

  }
  catch(e){

    console.error(e);

    loginView(
      "Greška pri učitavanju podataka: "+
      e.message
    );

    return;

  }


  if(profile.must_change_password){

    showChangePassword();

    return;

  }


  render();

}


/* =========================================
   UČITAVANJE PODATAKA
========================================= */

async function loadData(){

  /*
    Admin vidi najnovije kolo.
    Igrač vidi najnovije OBJAVLJENO kolo.

    Neobjavljeno kolo je vidljivo samo adminu.
  */

  let query=
    supabase
      .from("rounds")
      .select("*")
      .order(
        "round_number",
        {ascending:false}
      )
      .limit(1);


  if(!profile?.is_admin){

    query=
      query.eq(
        "is_published",
        true
      );

  }


  const r=
    await query.maybeSingle();


  if(r.error)
    throw new Error(r.error.message);


  round=r.data;

  matches=[];
  predictions=[];
  profiles=[];


  const pr=
    await supabase
      .from("profiles")
      .select(
        "id,name,is_admin,must_change_password"
      );


  if(!pr.error)
    profiles=pr.data||[];


  if(!round)
    return;


  const m=
    await supabase
      .from("matches")
      .select("*")
      .eq("round_id",round.id)
      .order("kickoff_at");


  if(m.error)
    throw new Error(m.error.message);


  matches=m.data||[];


  const p=
    await supabase
      .from("predictions")
      .select("*");


  if(!p.error)
    predictions=p.data||[];

}


/* =========================================
   GLAVNI IZBORNIK
========================================= */

function shell(){

  <div class="app">

    <header>

      <div>

        <div class="brand">

        </div>

/* =========================================
   RENDER
========================================= */

function render(){

  shell();


  document
    .querySelectorAll("[data-page]")
    .forEach(b=>
      b.classList.toggle(
        "active",
        b.dataset.page===currentPage
      )
    );


  if(currentPage==="predictions")
    showPredictions();


  if(currentPage==="results")
    showResults();


  if(currentPage==="table")
    showTable();


  if(currentPage==="admin")
    showAdmin();

}

function showChangePassword(){

  document.getElementById("root").innerHTML=`

  <div class="login">

    <form class="login-card" id="changeForm">

      <div style="font-size:42px">
        🔐
      </div>

      <h2>
        Postavi novu lozinku

      <p class="muted">

      </p>

      <label>

      </label>

      <input

      >

      <label>
        Ponovi lozinku
      </label>

      <input
        id="newPass2"
        type="password"
        minlength="6"
        required
      >

      <div class="actions">

        <button
          class="btn primary"

        >

    </form>

  `;


  document

      e.preventDefault();


      const a=
        document
          .getElementById("newPass")
          .value;


      const b=
        document
          .getElementById("newPass2")
          .value;


      if(a!==b){

        toast(
          "Lozinke se ne podudaraju."
        );

        return;

      }


      if(a.length<6){

        toast(
          "Lozinka mora imati najmanje 6 znakova."
        );

        return;

      }


      const {error}=
        await supabase.auth.updateUser({

        });

      }


      const {
        error:rpcError
      }=
        await supabase.rpc(

        );


      if(rpcError){

        toast(

        );

        return;

      }


      profile.must_change_password=false;

      await loadData();

      render();

    };

/* =========================================
   MOJA PROGNOZA
========================================= */

function myPrediction(matchId){

  return predictions.find(
    p=>
      p.match_id===matchId &&
      p.user_id===user.id
  );

}


/* =========================================
   PROGNOZE
========================================= */

function showPredictions(){

  const c=
    document.getElementById("content");


  if(!round){

    c.innerHTML=`
      <div class="card">
        <h2>Nema objavljenog kola</h2>
        <p class="muted">
          Admin još nije objavio novo kolo.
        </p>
      </div>
    `;

    return;

  }


  const isFinished=
    !!round.is_finished;


  c.innerHTML=`

  <div class="card">

    <h2>
      Prognoze —
      ${round.round_number}. kolo
    </h2>

    <p class="muted">

      ${
        isFinished
        ?"🏁 Kolo je završeno."
        :
        locked()
        ?"🔒 Kolo je zaključano."
        :"🟢 Prognoze su otvorene."
      }

      ${
        round.locked_at
        ?`Zaključavanje: ${fmtDate(round.locked_at)}`
        :""
      }

    </p>

  </div>


  <div
    class="card"
    id="matches"
  ></div>

  `;


  const box=
    document.getElementById("matches");


  if(!matches.length){

    box.innerHTML=`
      <p class="muted">
        Za ovo kolo još nema utakmica.
      </p>
    `;

    return;

  }


  matches.forEach(m=>{

    const p=
      myPrediction(m.id)||{};


    const h=
      p.predicted_home_score??"";


    const a=
      p.predicted_away_score??"";


    const o=
      p.predicted_outcome??"";


    box.insertAdjacentHTML(
      "beforeend",
      `

      <div
        class="match"
        data-mid="${m.id}"
      >

        <div class="team">

          ${esc(m.home_team)}

          <div class="score">

            <input
              class="ph"
              type="number"
              min="0"
              max="30"
              value="${esc(h)}"
              ${locked()||isFinished?"disabled":""}
            >

            <span>:</span>

            <input
              class="pa"
              type="number"
              min="0"
              max="30"
              value="${esc(a)}"
              ${locked()||isFinished?"disabled":""}
            >

          </div>

        </div>


        <div class="center">

          <span class="badge">
            ${fmtDate(m.kickoff_at)}
          </span>

          <div class="outcomes">

            ${
              ["1","X","2"]
                .map(x=>`

                  <button
                    class="ob ${o===x?"sel":""}"
                    data-o="${x}"
                    ${locked()||isFinished?"disabled":""}
                  >
                    ${x}
                  </button>

                `)
                .join("")
            }

          </div>

        </div>


        <div class="team away">

          ${esc(m.away_team)}

        </div>

      </div>

      `
    );

  });


  if(!locked()&&!isFinished){

    box.insertAdjacentHTML(
      "beforeend",
      `
      <div class="actions">

        <button
          class="btn primary"
          id="saveAll"
        >
          Spremi prognoze
        </button>

      </div>
      `
    );

  }


  box
    .querySelectorAll(".ob")
    .forEach(b=>{

      b.onclick=()=>{

        b.parentElement
          .querySelectorAll(".ob")
          .forEach(x=>
            x.classList.remove("sel")
          );

        b.classList.add("sel");

      };

    });


  document
    .getElementById("saveAll")
    ?.addEventListener(
      "click",
      savePredictions
    );

}


/* =========================================
   SPREMANJE PROGNOZA
========================================= */

async function savePredictions(){

  if(locked()||round?.is_finished){

    toast(
      "Kolo je zaključano."
    );

    return;

  }


  const rows=[];


  document
    .querySelectorAll(
      "#matches .match"
    )
    .forEach(el=>{

      const h=
        el.querySelector(".ph").value;


      const a=
        el.querySelector(".pa").value;


      const ob=
        el.querySelector(".ob.sel");


      if(
        h!=="" &&
        a!=="" &&
        ob
      ){

        rows.push({

          user_id:user.id,

          match_id:el.dataset.mid,

          predicted_home_score:
            Number(h),

          predicted_away_score:
            Number(a),

          predicted_outcome:
            ob.dataset.o

        });

      }

    });


  if(!rows.length){

    toast(
      "Unesi barem jednu kompletnu prognozu."
    );

    return;

  }


  const {error}=
    await supabase
      .from("predictions")
      .upsert(
        rows,
        {
          onConflict:
            "user_id,match_id"
        }
      );


  if(error){

    toast(error.message);

    return;

  }


  await loadData();


  toast(
    "Prognoze su spremljene."
  );


  showPredictions();

}

    <p class="muted">

      ${
        round.is_finished
        ?"🏁 Kolo je završeno — svi igrači vide sve prognoze."
        :
        locked()
        ?"🔓 Kolo je zaključano — sada svi igrači vide sve prognoze."
        :"🔒 Prije zaključavanja vidiš samo svoje prognoze."
      }

    </p>

    <div id="res"></div>

  </div>

  `;


  const box=
    document.getElementById("res");


  if(!matches.length){

    box.innerHTML=`
      <p class="muted">
        Nema utakmica.
      </p>
    `;

    return;

  }


  matches.forEach(m=>{

    const hasActual=
      m.actual_home_score!=null &&
      m.actual_away_score!=null;


    const actual=
      hasActual
      ?`${m.actual_home_score}:${m.actual_away_score}`
      :"—";


    let html=`

      <div class="match">

        <div class="team">

          ${esc(m.home_team)}
          –
          ${esc(m.away_team)}

        </div>


        <div class="center">

          <b>
            Stvarni:
            ${actual}
          </b>

        </div>


        <div class="right">

          <div class="pred-list">

    `;


    const visible=
      predictions.filter(
        p=>p.match_id===m.id
      );


    const list=
      locked()||round.is_finished

      ?visible

      :visible.filter(
        p=>p.user_id===user.id
      );


    if(list.length){

      list.forEach(p=>{

        let pointsText="—";


        /*
          Ako je stvarni rezultat već spremljen,
          računamo bodove odmah u JavaScriptu.

          VAŽNO:
          Ovo NE mijenja predictions.points.
          Zato se Poredak još ne mijenja.
        */

        if(hasActual){

          const temporaryPoints=
            calculatePoints(
              p.predicted_home_score,
              p.predicted_away_score,
              p.predicted_outcome,
              m.actual_home_score,
              m.actual_away_score
            );


          if(temporaryPoints!=null){

            pointsText=
              `${temporaryPoints} bod.`;

          }

        }
        else if(round.is_finished){

          pointsText=
            `${p.points??0} bod.`;

        }


        html+=`

          <div class="pred-row">

            <b>
              ${esc(nameById(p.user_id))}
            </b>:

            ${p.predicted_home_score}
            :
            ${p.predicted_away_score}

            · ishod
            ${esc(
              p.predicted_outcome||"-"
            )}

            ·

            <b>
              ${pointsText}
            </b>

          </div>

        `;

      });

    }
    else{

      html+=`
        <div class="muted">
          Nema prognoza.
        </div>
      `;

    }


    html+=`

          </div>

        </div>

      </div>

    `;


    box.insertAdjacentHTML(
      "beforeend",
      html
    );

  });

}

async function showTable(){

  const c=
    document.getElementById("content");


  c.innerHTML=`
    <div class="card">
      <h2>Poredak</h2>
      <p class="muted">
        Učitavanje...
      </p>
    </div>
  `;


  const [
    ps,
    sp,
    preds
  ]=
    await Promise.all([

      supabase
        .from("profiles")
        .select("id,name"),

      supabase
        .from("starting_points")
        .select("*"),

      supabase
        .from("predictions")
        .select(
          "user_id,points"
        )

    ]);


  if(ps.error){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          ${esc(ps.error.message)}
        </p>
      </div>
    `;

    return;

  }


  if(sp.error){

    console.warn(
      "starting_points:",
      sp.error.message
    );

  }


  if(preds.error){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          ${esc(preds.error.message)}
        </p>
      </div>
    `;

    return;

  }


  const startBy={};


  (sp.data||[])
    .forEach(x=>{

      const name=
        x.name ||
        x.player_name;


      if(name!=null){

        startBy[name]=
          Number(
            x.points ??
            x.starting_points ??
            0
          );

      }

    });


  const earned={};


  /*
    Poredak namjerno koristi samo
    spremljeni predictions.points.

    Privremeni bodovi iz Rezultata se
    ovdje NE računaju.

    Zato se Poredak mijenja tek nakon
    finish_round().
  */

  (preds.data||[])
    .forEach(x=>{

      earned[x.user_id]=
        (earned[x.user_id]||0)+
        Number(x.points||0);

    });


  const rows=
    (ps.data||[])
      .map(p=>{

        const start=
          startBy[p.name] ??
          START[p.name] ??
          0;


        const nova=
          earned[p.id]||0;


        return {

          name:p.name,

          start,

          nova,

          total:start+nova

        };

      })


      .sort(
        (a,b)=>
          b.total-a.total
      );


  c.innerHTML=`

  <div class="card">

    <h2>
      Ukupni poredak
    </h2>

    <table>

      <thead>

        <tr>

          <th>#</th>
          <th>Igrač</th>
          <th>Početni</th>
          <th>Nova</th>
          <th>Ukupno</th>

        </tr>

      </thead>


      <tbody>

        ${
          rows
            .map(
              (x,i)=>`

              <tr>

                <td>
                  ${i+1}
                </td>

                <td>
                  <b>
                    ${esc(x.name)}
                  </b>
                </td>

                <td>
                  ${x.start}
                </td>

                <td>
                  ${x.nova}
                </td>

                <td>
                  <b>
                    ${x.total}
                  </b>
                </td>

              </tr>

            `
            )
            .join("")
        }

      </tbody>

    </table>

  </div>

  `;

}

async function saveAdminSchedule(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može uređivati raspored."
    );

    return;

  }


  if(!round||round.is_finished){

    toast(
      "Kolo je završeno."
    );

    return;

  }


  if(locked()){

    toast(
      "Kolo je već zaključano."
    );

    return;

  }


  const rows=
    Array.from(
      document.querySelectorAll(
        "#adminSchedule .admin-match"
      )
    );


  if(!rows.length){

    toast(
      "Dodaj barem jednu utakmicu."
    );

    return;

  }


  const data=[];


  for(const row of rows){

    const home=
      row
        .querySelector(".homeTeam")
        .value
        .trim();


    const away=
      row
        .querySelector(".awayTeam")
        .value
        .trim();


    const date=
      row
        .querySelector(".matchDate")
        .value;


    const time=
      row
        .querySelector(".matchTime")
        .value;


    if(!home||!away||!date||!time){

      toast(
        "Svaka utakmica mora imati domaćina, gosta, datum i vrijeme."
      );

      return;

    }


    if(home===away){

      toast(
        "Domaćin i gost ne mogu biti isti."
      );

      return;

    }


    const kickoff=
      toISO(date,time);


    if(!kickoff){

      toast(
        "Jedan od unesenih termina nije ispravan."
      );

      return;

    }


    data.push({
      row,
      home,
      away,
      kickoff
    });

  }


  /*
    Prvo spremamo postojeće utakmice.
  */

  for(const item of data){

    const id=
      item.row.dataset.mid;


    if(id){

      const {error}=
        await supabase
          .from("matches")
          .update({

            home_team:item.home,

            away_team:item.away,

            kickoff_at:item.kickoff,

            schedule_source:
              "admin",

            schedule_updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            id
          );


      if(error){

        toast(error.message);

        return;

      }

    }

  }


  /*
    Zatim dodajemo nove utakmice.
  */

  for(const item of data){

    if(item.row.dataset.new!=="true")
      continue;


    const {error}=
      await supabase
        .from("matches")
        .insert({

          round_id:round.id,

          home_team:item.home,

          away_team:item.away,

          kickoff_at:item.kickoff,

          schedule_source:
            "admin",

          schedule_updated_at:
            new Date().toISOString()

        });


    if(error){

      toast(error.message);

      return;

    }

  }


  /*
    Zaključavanje se automatski računa
    2 sata prije prve utakmice.

    Ako admin promijeni termin prve utakmice,
    prije zaključavanja se pomiče i vrijeme
    zaključavanja.
  */

  const newKickoffs=
    data.map(x=>x.kickoff);


  const newLockedAt=
    lockFromKickoffs(
      newKickoffs
    );


  if(newLockedAt){

    const {error}=
      await supabase
        .from("rounds")
        .update({
          locked_at:newLockedAt
        })
        .eq(
          "id",
          round.id
        );


    if(error){

      toast(error.message);

      return;

    }

  }


  await loadData();


  toast(
    "Raspored je spremljen."
  );


  showAdmin();

}

async function saveSingleResult(matchId){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može unositi rezultate."
    );

    return;

  }


  if(!round||round.is_finished){

    toast(
      "Kolo je već završeno."
    );

    return;

  }


  const row=
    document.querySelector(
      `.admin-result-box[data-mid="${matchId}"]`
    );


  if(!row){

    toast(
      "Utakmica nije pronađena."
    );

    return;

  }


  const h=
    row
      .querySelector(".ah")
      .value
      .trim();


  const a=
    row
      .querySelector(".aa")
      .value
      .trim();


  if(h===""||a===""){

    toast(
      "Unesi oba dijela rezultata."
    );

    return;

  }


  const homeScore=
    Number(h);


  const awayScore=
    Number(a);


  if(
    !Number.isInteger(homeScore) ||
    !Number.isInteger(awayScore) ||
    homeScore<0 ||
    awayScore<0 ||
    homeScore>30 ||
    awayScore>30
  ){

    toast(
      "Rezultat mora biti cijeli broj od 0 do 30."
    );

    return;

  }


  const button=
    row.querySelector(".save-result");


  if(button)
    button.disabled=true;


  const {error}=
    await supabase
      .from("matches")
      .update({

        actual_home_score:
          homeScore,

        actual_away_score:
          awayScore

      })
      .eq(
        "id",
        matchId
      );


  if(button)
    button.disabled=false;


  if(error){

    toast(
      "Spremanje rezultata nije uspjelo: "+
      error.message
    );

    return;

  }


  /*
    Ovdje namjerno NE pozivamo finish_round.

    Zato se predictions.points ne mijenjaju
    i Poredak ostaje isti.

    Samo ponovno učitavamo podatke kako bi
    rezultat i privremeni bodovi odmah bili vidljivi.
  */

  await loadData();


  toast(
    "Rezultat je spremljen."
  );


  showAdmin();

}

async function createRound(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može napraviti novo kolo."
    );

    return;

  }


  const numberValue=
    document
      .getElementById(
        "newRoundNumber"
      )
      .value
      .trim();


  const roundNumber=
    Number(numberValue);


  if(
    !numberValue ||
    !Number.isInteger(roundNumber) ||
    roundNumber<1
  ){

    toast(
      "Unesi ispravan broj kola."
    );

    return;

  }


  /*
    Provjera postoji li već to kolo.
  */

  const existing=
    await supabase
      .from("rounds")
      .select("id,round_number")
      .eq(
        "round_number",
        roundNumber
      )
      .maybeSingle();


  if(existing.error){

    toast(
      existing.error.message
    );

    return;

  }


  if(existing.data){

    toast(
      `${roundNumber}. kolo već postoji.`
    );

    return;

  }


  const rows=
    Array.from(
      document.querySelectorAll(
        "#newRoundMatches .new-round-row"
      )
    );


  if(!rows.length){

    toast(
      "Dodaj barem jednu utakmicu."
    );

    return;

  }


  const games=[];


  for(const row of rows){

    const home=
      row
        .querySelector(".newHome")
        .value
        .trim();


    const away=
      row
        .querySelector(".newAway")
        .value
        .trim();


    const date=
      row
        .querySelector(".newDate")
        .value;


    const time=
      row
        .querySelector(".newTime")
        .value;


    if(!home||!away||!date||!time){

      toast(
        "Svaka utakmica mora imati domaćina, gosta, datum i vrijeme."
      );

      return;

    }


    if(home===away){

      toast(
        "Domaćin i gost ne mogu biti isti."
      );

      return;

    }


    const kickoff=
      toISO(date,time);


    if(!kickoff){

      toast(
        "Jedan od termina nije ispravan."
      );

      return;

    }


    games.push({
      home,
      away,
      kickoff
    });

  }


  const lockedAt=
    lockFromKickoffs(
      games.map(x=>x.kickoff)
    );


  /*
    Prvo stvaramo kolo kao NEOBJAVLJENO.
  */

  const createdRound=
    await supabase
      .from("rounds")
      .insert({

        round_number:
          roundNumber,

        locked_at:
          lockedAt,

        is_finished:
          false,

        is_published:
          false

      })
      .select("*")
      .single();


  if(createdRound.error){

    toast(
      createdRound.error.message
    );

    return;

  }


  const newRound=
    createdRound.data;


  /*
    Dodajemo sve utakmice.
  */

  for(const game of games){

    const {error}=
      await supabase
        .from("matches")
        .insert({

          round_id:
            newRound.id,

          home_team:
            game.home,

          away_team:
            game.away,

          kickoff_at:
            game.kickoff,

          schedule_source:
            "admin",

          schedule_updated_at:
            new Date().toISOString()

        });


    if(error){

      toast(
        "Kolo je napravljeno, ali utakmica nije spremljena: "+
        error.message
      );

      return;

    }

  }


  /*
    Tek kada su utakmice uspješno spremljene,
    objavljujemo kolo.
  */

  const published=
    await supabase
      .from("rounds")
      .update({
        is_published:true
      })
      .eq(
        "id",
        newRound.id
      );


  if(published.error){

    toast(
      "Kolo je spremljeno, ali objava nije uspjela: "+
      published.error.message
    );

    return;

  }


  /*
    Učitavamo novo kolo.
  */

  await loadData();


  currentPage="admin";


  toast(
    `${roundNumber}. kolo je spremljeno i objavljeno.`
  );


  render();

}


/* =========================================
   ADMIN — RESET LOZINKE
========================================= */

async function adminResetPassword(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može resetirati lozinke."
    );

    return;

  }


  const userId=
    document
      .getElementById("resetPlayer")
      .value;


  const password=
    document
      .getElementById("temporaryPassword")
      .value
      .trim();


  const message=
    document
      .getElementById("resetMessage");


  if(!userId){

    message.textContent=
      "Odaberi igrača.";

    return;

  }


  if(password.length<6){

    message.textContent=
      "Privremena lozinka mora imati najmanje 6 znakova.";

    return;

  }


  const {
    data:{
      session
    }
  }=
    await supabase.auth.getSession();


  if(!session){

    message.textContent=
      "Sesija je istekla. Ponovno se prijavi.";

    return;

  }


  message.textContent=
    "Resetiranje lozinke...";


  try{

    const response=
      await fetch(
        SUPABASE_URL+
        "/functions/v1/admin-reset-password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              session.access_token
          },

          body:JSON.stringify({
            user_id:userId,
            temporary_password:password
          })
        }
      );


    const text=
      await response.text();


    let data={};


    try{

      data=
        JSON.parse(text);

    }
    catch{

      data={
        message:text
      };

    }


    if(!response.ok){

      message.textContent=
        data.error ||
        data.message ||
        "Resetiranje nije uspjelo.";

      return;

    }


    message.textContent=
      "Lozinka je resetirana. Igrač mora postaviti novu lozinku pri prvoj prijavi.";


    document
      .getElementById(
        "temporaryPassword"
      )
      .value="";


  }
  catch(e){

    console.error(e);

    message.textContent=
      "Greška pri povezivanju sa serverom.";

  }

}


/* =========================================
   ZAVRŠAVANJE KOLA
========================================= */

async function finishRound(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može završiti kolo."
    );

    return;

  }


  if(!round||round.is_finished){

    toast(
      "Kolo je već završeno."
    );

    return;

  }


  if(!matches.length){

    toast(
      "Nema utakmica za obračun."
    );

    return;

  }


  const updates=[];


  document
    .querySelectorAll(
      "#adminResults .admin-result-box"
    )
    .forEach(el=>{

      const h=
        el.querySelector(".ah").value;


      const a=
        el.querySelector(".aa").value;


      if(
        h!=="" &&
        a!==""
      ){

        updates.push({

          id:el.dataset.mid,

          actual_home_score:
            Number(h),

          actual_away_score:
            Number(a)

        });

      }

    });


  /*
    Nema više ograničenja na 5.
    SVE utakmice moraju imati rezultat.
  */

  if(
    updates.length!==matches.length
  ){

    toast(
      "Unesi rezultat svih utakmica."
    );

    return;

  }


  for(const x of updates){

    const {error}=
      await supabase
        .from("matches")
        .update({

          actual_home_score:
            x.actual_home_score,

          actual_away_score:
            x.actual_away_score

        })
        .eq(
          "id",
          x.id
        );


    if(error){

      toast(error.message);

      return;

    }

  }


  const {error}=
    await supabase.rpc(
      "finish_round",
      {
        p_round_id:round.id
      }
    );


  if(error){

    toast(
      "Rezultati su spremljeni, ali obračun nije uspio: "+
      error.message
    );

    return;

  }


  toast(
    "Kolo je obračunato i završeno."
  );


  await loadData();


  currentPage="results";


  render();

}


/* =========================================
   POKRETANJE
========================================= */

async function boot(){

  try{

    const {data}=
      await supabase.auth.getSession();


    if(data.session){

      await start(
        data.session.user
      );

    }
    else{

      loginView();

    }

  }
  catch(e){

    console.error(e);

    loginView(
      "Aplikacija se nije mogla pokrenuti. Provjeri Supabase vezu."
    );

  }

}


supabase.auth.onAuthStateChange(
  (_event,session)=>{

    if(!session&&!user)
      loginView();

  }
);


boot();

</script>
