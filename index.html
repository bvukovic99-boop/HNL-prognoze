<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL=
  "https://tiumqykmnatvdljbfcwr.supabase.co";


const SUPABASE_KEY=
  "sb_publishable_egI9OFlNjMyq0q6p3R4uLw_AqTRLh6T";


const supabase=
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   POČETNI BODOVI
========================================= */

const START={
  "Gogi":32,
  "Nikša":27,
  "Velin":26,
  "Toni":21,
  "Igor":19,
  "Danijel":12,
  "Bojan":7
};


/* =========================================
   GLOBALNE VARIJABLE
========================================= */

let user=null;
let profile=null;
let round=null;
let matches=[];
let predictions=[];
let profiles=[];
let currentPage="predictions";

let historyRounds=[];
let historyRoundId=null;


/* =========================================
   POMOĆNE FUNKCIJE
========================================= */

function esc(v){

  return String(v??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


function toast(msg){

  const x=
    document.getElementById("toast");

  x.textContent=msg;

  x.classList.remove("hidden");

  clearTimeout(window.__toast);

  window.__toast=
    setTimeout(
      ()=>x.classList.add("hidden"),
      2800
    );

}


function locked(){

  return !!round?.locked_at &&
    new Date(round.locked_at)<=new Date();

}


function fmtDate(s){

  if(!s)
    return "-";

  return new Date(s).toLocaleString(
    "hr-HR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function inputDate(s){

  if(!s)
    return "";

  const d=new Date(s);

  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function inputTime(s){

  if(!s)
    return "";

  const d=new Date(s);

  const h=String(d.getHours()).padStart(2,"0");
  const m=String(d.getMinutes()).padStart(2,"0");

  return `${h}:${m}`;

}


function toISO(date,time){

  if(!date||!time)
    return null;

  const d=
    new Date(
      `${date}T${time}:00`
    );

  if(Number.isNaN(d.getTime()))
    return null;

  return d.toISOString();

}


function lockFromKickoffs(items){

  const times=
    items
      .map(x=>new Date(x))
      .filter(
        x=>!Number.isNaN(x.getTime())
      );

  if(!times.length)
    return null;

  const earliest=
    Math.min(
      ...times.map(x=>x.getTime())
    );

  return new Date(
    earliest-
    2*60*60*1000
  ).toISOString();

}


function nameById(id){

  const p=
    profiles.find(
      x=>x.id===id
    );

  return p?.name||"Igrač";

}


function outcomeFromScore(home,away){

  if(
    home==null ||
    away==null
  )
    return null;

  return(
    Number(home)>Number(away)
      ?"1"
      :
    Number(home)<Number(away)
      ?"2"
      :"X"
  );

}


/* =========================================
   BODOVI
========================================= */

function calculatePoints(
  predictedHome,
  predictedAway,
  predictedOutcome,
  actualHome,
  actualAway
){

  if(
    actualHome==null ||
    actualAway==null
  ){

    return null;

  }


  const exact=
    Number(predictedHome)===
      Number(actualHome) &&
    Number(predictedAway)===
      Number(actualAway);


  const actualOutcome=
    outcomeFromScore(
      actualHome,
      actualAway
    );


  const outcomeCorrect=
    predictedOutcome===
    actualOutcome;


  return(
    (exact?3:0)+
    (outcomeCorrect?1:0)
  );

}


/* =========================================
   STATUS UTAKMICE
========================================= */

function matchStatus(m){

  const hasActual=
    m.actual_home_score!=null &&
    m.actual_away_score!=null;


  if(hasActual){

    return {
      cls:"status-played",
      text:"🟢 Odigrano"
    };

  }


  if(
    round &&
    locked()
  ){

    return {
      cls:"status-locked",
      text:"🔴 Utakmica zaključana"
    };

  }


  return {
    cls:"status-wait",
    text:"🟠 Čeka se utakmica"
  };

}


/* =========================================
   LOGIN
========================================= */

function loginView(message=""){

  document.getElementById("root").innerHTML=`

  <div class="login">

    <form
      class="login-card"
      id="loginForm"
    >

      <div style="font-size:42px">
        🏆
      </div>

      <h1>
        HNL Prognoza
      </h1>

      <p class="muted">
        Prognoziraj utakmice SuperSport HNL-a.
      </p>

      ${
        message
        ?`<p class="danger">${esc(message)}</p>`
        :""
      }

      <label>
        Korisničko ime
      </label>

      <input
        id="username"
        autocomplete="username"
        placeholder="npr. Bojan"
        required
      >

      <label>
        Lozinka
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <div class="actions">

        <button
          class="btn primary"
          style="width:100%"
        >
          Prijava
        </button>

      </div>

    </form>

  </div>

  `;


  document
    .getElementById("loginForm")
    .onsubmit=login;

}


async function login(e){

  e.preventDefault();


  const username=
    document
      .getElementById("username")
      .value
      .trim()
      .toLowerCase();


  const password=
    document
      .getElementById("password")
      .value;


  const email=
    username.endsWith("@hnl.local")
      ?username
      :username+"@hnl.local";


  const {
    data,
    error
  }=
    await supabase.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    loginView(error.message);

    return;

  }


  await start(data.user);

}


/* =========================================
   START
========================================= */

async function start(u){

  user=u;


  const {
    data:p,
    error
  }=
    await supabase
      .from("profiles")
      .select("*")
      .eq("id",u.id)
      .maybeSingle();


  if(error||!p){

    loginView(
      "Greška pri učitavanju profila."
    );

    return;

  }


  profile=p;


  try{

    await loadData();

  }
  catch(e){

    console.error(e);

    loginView(
      "Greška pri učitavanju podataka: "+
      e.message
    );

    return;

  }


  if(profile.must_change_password){

    showChangePassword();

    return;

  }


  render();

}


/* =========================================
   UČITAVANJE PODATAKA
========================================= */

async function loadData(){

  let query=
    supabase
      .from("rounds")
      .select("*")
      .order(
        "round_number",
        {ascending:false}
      )
      .limit(1);


  if(!profile?.is_admin){

    query=
      query.eq(
        "is_published",
        true
      );

  }


  const r=
    await query.maybeSingle();


  if(r.error)
    throw new Error(r.error.message);


  round=r.data;

  matches=[];
  predictions=[];
  profiles=[];


  const pr=
    await supabase
      .from("profiles")
      .select(
        "id,name,is_admin,must_change_password"
      );


  if(!pr.error)
    profiles=pr.data||[];


  if(!round){

    historyRounds=[];

    return;

  }


  const m=
    await supabase
      .from("matches")
      .select("*")
      .eq(
        "round_id",
        round.id
      )
      .order("kickoff_at");


  if(m.error)
    throw new Error(m.error.message);


  matches=m.data||[];


  const p=
    await supabase
      .from("predictions")
      .select("*");


  if(!p.error)
    predictions=p.data||[];


  const hr=
    await supabase
      .from("rounds")
      .select("*")
      .eq(
        "is_published",
        true
      )
      .order(
        "round_number",
        {ascending:false}
      );


  if(!hr.error)
    historyRounds=hr.data||[];
  else
    historyRounds=[];

}


/* =========================================
   GLAVNI IZBORNIK
========================================= */

function shell(){

  document.getElementById("root").innerHTML=`

  <div class="app">

    <header>

      <div>

        <div class="brand">
          🏆 HNL Prognoza
        </div>

        <span class="sub">
          Prijavljen:
          ${esc(profile?.name||"Igrač")}
        </span>

      </div>


      <nav class="nav">

        <button data-page="predictions">
          Prognoze
        </button>

        <button data-page="results">
          Rezultati
        </button>

        <button data-page="table">
          Poredak
        </button>

        <button data-page="history">
          Povijest
        </button>

        <button data-page="stats">
          Moja statistika
        </button>

        ${
          profile?.is_admin
          ?'<button data-page="admin">Admin</button>'
          :""
        }

        <button id="logout">
          Odjava
        </button>

      </nav>

    </header>


    <main id="content"></main>

  </div>

  `;


  document
    .querySelectorAll("[data-page]")
    .forEach(b=>{

      b.onclick=()=>{

        currentPage=
          b.dataset.page;

        render();

      };

    });


  document
    .getElementById("logout")
    .onclick=async()=>{

      await supabase.auth.signOut();

      user=null;
      profile=null;

      loginView();

    };

}


/* =========================================
   RENDER
========================================= */

function render(){

  shell();


  document
    .querySelectorAll("[data-page]")
    .forEach(b=>
      b.classList.toggle(
        "active",
        b.dataset.page===currentPage
      )
    );


  if(currentPage==="predictions")
    showPredictions();


  if(currentPage==="results")
    showResults();


  if(currentPage==="table")
    showTable();


  if(currentPage==="history")
    showHistory();


  if(currentPage==="stats")
    showStats();


  if(currentPage==="admin")
    showAdmin();

}

    </form>

  </div>

  `;


  document
    .getElementById("changeForm")
    .onsubmit=async e=>{

      e.preventDefault();


      const a=
        document
          .getElementById("newPass")
          .value;


      const b=
        document
          .getElementById("newPass2")
          .value;


      if(a!==b){

        toast(
          "Lozinke se ne podudaraju."
        );

        return;

      }


      if(a.length<6){

        toast(
          "Lozinka mora imati najmanje 6 znakova."
        );

        return;

      }


      const {error}=
        await supabase.auth.updateUser({
          password:a
        });


      if(error){

        toast(error.message);

        return;

      }


      const {
        error:rpcError
      }=
        await supabase.rpc(
          "clear_my_password_change"
        );


      if(rpcError){

        toast(
          "Lozinka je promijenjena, ali oznaka promjene nije očišćena."
        );

        return;

      }


      profile.must_change_password=false;

      await loadData();

      render();

    };

}

========================================= */

async function savePredictions(){

  if(locked()||round?.is_finished){

    toast(
      "Kolo je zaključano."
    );

    return;

  }


  const rows=[];


  document
    .querySelectorAll(
      "#matches .match-card"
    )
    .forEach(el=>{

      const h=
        el.querySelector(".ph").value;


      const a=
        el.querySelector(".pa").value;


      const ob=
        el.querySelector(".ob.sel");


      if(
        h!=="" &&
        a!=="" &&
        ob
      ){

        rows.push({

          user_id:user.id,

          match_id:el.dataset.mid,

          predicted_home_score:
            Number(h),

          predicted_away_score:
            Number(a),

          predicted_outcome:
            ob.dataset.o

        });

      }

    });


  if(!rows.length){

    toast(
      "Unesi barem jednu kompletnu prognozu."
    );

    return;

  }


  const {error}=
    await supabase
      .from("predictions")
      .upsert(
        rows,
        {
          onConflict:
            "user_id,match_id"
        }
      );


  if(error){

    toast(error.message);

    return;

  }


  await loadData();


  toast(
    "Prognoze su spremljene."
  );


  showPredictions();

}

              m.actual_home_score,

async function showTable(){

  const c=
    document.getElementById("content");


  c.innerHTML=`
    <div class="card">
      <h2>Poredak</h2>
      <p class="muted">
        Učitavanje...
      </p>
    </div>
  `;


  const [
    ps,
    sp,
    preds,
    finishedRounds
  ]=
    await Promise.all([

      supabase
        .from("profiles")
        .select("id,name"),

      supabase
        .from("starting_points")
        .select("*"),

      supabase
        .from("predictions")
        .select(
          "user_id,match_id,points"
        ),

      supabase
        .from("rounds")
        .select(
          "id,round_number,is_finished"
        )
        .eq(
          "is_finished",
          true
        )
        .eq(
          "is_published",
          true
        )
        .order(
          "round_number",
          {ascending:false}
        )

    ]);


  if(ps.error){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          ${esc(ps.error.message)}
        </p>
      </div>
    `;

    return;

  }


  if(preds.error){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          ${esc(preds.error.message)}
        </p>
      </div>
    `;

    return;

  }


  const startBy={};


  (sp.data||[])
    .forEach(x=>{

      const name=
        x.name ||
        x.player_name;


      if(name!=null){

        startBy[name]=
          Number(
            x.points ??
            x.starting_points ??
            0
          );

      }

    });


  const earned={};


  (preds.data||[])
    .forEach(x=>{

      earned[x.user_id]=
        (earned[x.user_id]||0)+
        Number(x.points||0);

    });


  let lastRound=null;


  if(
    !finishedRounds.error &&
    finishedRounds.data?.length
  ){

    lastRound=
      finishedRounds.data[0];

  }


  let lastRoundMatchIds=[];


  if(lastRound){

    const lm=
      await supabase
        .from("matches")
        .select("id")
        .eq(
          "round_id",
          lastRound.id
        );


    if(!lm.error){

      lastRoundMatchIds=
        (lm.data||[]).map(
          x=>x.id
        );

    }

  }


  const lastRoundPoints={};


  (preds.data||[])
    .forEach(p=>{

      if(
        lastRoundMatchIds.includes(
          p.match_id
        )
      ){

        lastRoundPoints[p.user_id]=
          (lastRoundPoints[p.user_id]||0)+
          Number(p.points||0);

      }

    });


  const rows=
    (ps.data||[])
      .map(p=>{

        const start=
          startBy[p.name] ??
          START[p.name] ??
          0;


        const nova=
          earned[p.id]||0;


        return {

          id:p.id,

          name:p.name,

          start,

          nova,

          total:
            start+nova,

          last:
            lastRound
            ?lastRoundPoints[p.id]||0
            :null

        };

      })
      .sort(
        (a,b)=>
          b.total-a.total
      );


  c.innerHTML=`

  <div class="card">

    <h2>
      🏆 Ukupni poredak
    </h2>

    <p class="muted">

      ${
        lastRound
        ?`Dodatno su prikazani bodovi iz
           ${lastRound.round_number}. završenog kola.`
        :"Još nema završenog kola."
      }

    </p>

    <div style="overflow-x:auto">

      <table>

        <thead>

          <tr>

            <th>#</th>

            <th>Igrač</th>

            <th>Početni</th>

            <th>Nova</th>

            <th>
              ${
                lastRound
                ?`${lastRound.round_number}. kolo`
                :"Zadnje kolo"
              }
            </th>

            <th>Ukupno</th>

          </tr>

        </thead>


        <tbody>

          ${
            rows
              .map(
                (x,i)=>`

                <tr>

                  <td class="rank-number">

                    ${
                      i===0
                      ?"🥇"
                      :
                      i===1
                      ?"🥈"
                      :
                      i===2
                      ?"🥉"
                      :i+1
                    }

                  </td>


                  <td>
                    <b>
                      ${esc(x.name)}
                    </b>
                  </td>


                  <td>
                    ${x.start}
                  </td>


                  <td>
                    ${x.nova}
                  </td>


                  <td class="last-round">

                    ${
                      x.last==null
                      ?"—"
                      :x.last
                    }

                  </td>


                  <td>

                    <b>
                      ${x.total}
                    </b>

                  </td>

                </tr>

              `
              )
              .join("")
          }

        </tbody>

      </table>

    </div>

  </div>

  `;

}

async function showStats(){

  const c=
    document.getElementById("content");


  c.innerHTML=`

    <div class="card">

      <h2>
        📊 Moja statistika
      </h2>

      <p class="muted">
        Pregled tvojih dosadašnjih rezultata.
      </p>

      <div id="statsContent">
        Učitavanje...
      </div>

    </div>

  `;


  const allMatches=
    await supabase
      .from("matches")
      .select(
        "id,round_id,actual_home_score,actual_away_score"
      );


  if(allMatches.error){

    document.getElementById(
      "statsContent"
    ).innerHTML=`

      <p class="danger">
        ${esc(allMatches.error.message)}
      </p>

    `;

    return;

  }


  const finished=
    await supabase
      .from("rounds")
      .select(
        "id,round_number,is_finished"
      )
      .eq(
        "is_finished",
        true
      )
      .eq(
        "is_published",
        true
      )
      .order(
        "round_number",
        {ascending:true}
      );


  if(finished.error){

    document.getElementById(
      "statsContent"
    ).innerHTML=`

      <p class="danger">
        ${esc(finished.error.message)}
      </p>

    `;

    return;

  }


  const myPreds=
    await supabase
      .from("predictions")
      .select("*")
      .eq(
        "user_id",
        user.id
      );


  if(myPreds.error){

    document.getElementById(
      "statsContent"
    ).innerHTML=`

      <p class="danger">
        ${esc(myPreds.error.message)}
      </p>

    `;

    return;

  }


  const matchesById={};


  (allMatches.data||[])
    .forEach(m=>{

      matchesById[m.id]=m;

    });


  const finishedIds=
    new Set(
      (finished.data||[])
        .map(r=>r.id)
    );


  const finishedMatches=
    (allMatches.data||[])
      .filter(
        m=>
          finishedIds.has(
            m.round_id
          )
      );


  let earned=0;
  let exactCount=0;
  let outcomeCount=0;


  const roundPoints={};


  (myPreds.data||[])
    .forEach(p=>{

      const m=
        matchesById[p.match_id];


      if(!m)
        return;


      if(
        !finishedIds.has(
          m.round_id
        )
      )
        return;


      if(
        m.actual_home_score==null ||
        m.actual_away_score==null
      )
        return;


      const pts=
        calculatePoints(
          p.predicted_home_score,
          p.predicted_away_score,
          p.predicted_outcome,
          m.actual_home_score,
          m.actual_away_score
        );


      if(pts==null)
        return;


      earned+=pts;


      const exact=
        Number(p.predicted_home_score)===
          Number(m.actual_home_score) &&
        Number(p.predicted_away_score)===
          Number(m.actual_away_score);


      const outcome=
        p.predicted_outcome===
        outcomeFromScore(
          m.actual_home_score,
          m.actual_away_score
        );


      if(exact)
        exactCount++;


      if(outcome)
        outcomeCount++;


      roundPoints[m.round_id]=
        (roundPoints[m.round_id]||0)+
        pts;

    });


  const starting=
    START[profile.name]||0;


  const startFromDb=
    await supabase
      .from("starting_points")
      .select("*");


  let actualStarting=starting;


  if(!startFromDb.error){

    const found=
      (startFromDb.data||[])
        .find(x=>
          (x.name||x.player_name)===
          profile.name
        );


    if(found){

      actualStarting=
        Number(
          found.points ??
          found.starting_points ??
          starting
        );

    }

  }


  const total=
    actualStarting+earned;


  const finishedCount=
    (finished.data||[]).length;


  const average=
    finishedCount
    ?(earned/finishedCount).toFixed(1)
    :"0.0";


  let bestRound=null;


  (finished.data||[])
    .forEach(r=>{

      const pts=
        roundPoints[r.id]||0;


      if(
        bestRound==null ||
        pts>bestRound.points
      ){

        bestRound={
          round:r.round_number,
          points:pts
        };

      }

    });


  const predictionCount=
    (myPreds.data||[])
      .filter(p=>{

        const m=
          matchesById[p.match_id];

        return(
          m &&
          finishedIds.has(m.round_id) &&
          m.actual_home_score!=null &&
          m.actual_away_score!=null
        );

      })
      .length;


  const accuracy=
    predictionCount
    ?Math.round(
      (outcomeCount/
       predictionCount)*100
    )
    :0;


  const stats=
    document.getElementById(
      "statsContent"
    );


  stats.innerHTML=`

    <h3>
      ${esc(profile.name)}
    </h3>


    <div class="stats-grid">

      <div class="stat-box">

        <div class="stat-label">
          Ukupno bodova
        </div>

        <div class="stat-value">
          ${total}
        </div>

        <div class="stat-small">
          ${actualStarting} početnih + ${earned} osvojenih
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-label">
          Prosjek po kolu
        </div>

        <div class="stat-value">
          ${average}
        </div>

        <div class="stat-small">
          kroz ${finishedCount} završenih kola
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-label">
          Točnih rezultata
        </div>

        <div class="stat-value">
          ${exactCount}
        </div>

        <div class="stat-small">
          ⭐ točan rezultat
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-label">
          Točnih ishoda
        </div>

        <div class="stat-value">
          ${outcomeCount}
        </div>

        <div class="stat-small">
          ✓ 1 / X / 2
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-label">
          Prognoziranih utakmica
        </div>

        <div class="stat-value">
          ${predictionCount}
        </div>

        <div class="stat-small">
          na završenim utakmicama
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-label">
          Uspješnost ishoda
        </div>

        <div class="stat-value">
          ${accuracy}%
        </div>

        <div class="stat-small">
          pogođeni ishodi / prognoze
        </div>

      </div>

    </div>


    ${
      bestRound
      ?`
        <div class="best-round">

          <b>
            🏆 Najbolje kolo
          </b>

          <div style="margin-top:5px">

            ${bestRound.round}. kolo —
            <b>${bestRound.points} bodova</b>

          </div>

        </div>
      `
      :""
    }

  `;

}

      <h2>
        Povijest prognoza
      </h2>

      <p class="muted">
        Odaberi prethodno kolo za pregled
        prognoza, stvarnih rezultata i osvojenih
        bodova.
      </p>

      <div id="historyRounds"></div>

    </div>

    <div id="historyDetail"></div>

  `;


  const roundBox=
    document.getElementById(
      "historyRounds"
    );


  if(!historyRounds.length){

    roundBox.innerHTML=`
      <p class="muted">
        Još nema povijesti kola.
      </p>
    `;

    return;

  }


  historyRounds.forEach(r=>{

    const isCurrent=
      round &&
      r.id===round.id;


    roundBox.insertAdjacentHTML(
      "beforeend",
      `

      <div
        class="history-round ${
          historyRoundId===r.id
          ?"active"
          :""
        }"
        data-history-id="${r.id}"
      >

        <div class="history-round-title">

          ${r.round_number}. kolo

          ${
            isCurrent
            ?` · <span class="badge">trenutno</span>`
            :""
          }

        </div>

        <div class="history-round-info">

          ${
            r.is_finished
            ?"🏁 Završeno"
            :"🔒 Nije završeno"
          }

        </div>

      </div>

      `
    );

  });


  roundBox
    .querySelectorAll(".history-round")
    .forEach(el=>{

      el.onclick=()=>{

        historyRoundId=
          Number(
            el.dataset.historyId
          );

        showHistory();

      };

    });


  if(historyRoundId==null){

    const firstFinished=
      historyRounds.find(
        r=>
          r.is_finished &&
          (!round||r.id!==round.id)
      );


    if(firstFinished){

      historyRoundId=
        firstFinished.id;

    }
    else{

      const firstOther=
        historyRounds.find(
          r=>
            !round ||
            r.id!==round.id
        );


      if(firstOther)
        historyRoundId=
          firstOther.id;

    }


    if(historyRoundId!=null){

      showHistory();

      return;

    }

  }


  if(historyRoundId==null)
    return;


  await showHistoryRound(
    historyRoundId
  );

}

async function showHistoryRound(roundId){

  const c=
    document.getElementById(
      "historyDetail"
    );


  if(!c)
    return;


  c.innerHTML=`

    <div class="card">

      <h2>
        Učitavanje povijesti...
      </h2>

    </div>

  `;


  const selectedRound=
    historyRounds.find(
      r=>r.id===roundId
    );


  if(!selectedRound){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          Kolo nije pronađeno.
        </p>
      </div>
    `;

    return;

  }


  const m=
    await supabase
      .from("matches")
      .select("*")
      .eq(
        "round_id",
        selectedRound.id
      )
      .order("kickoff_at");


  if(m.error){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          ${esc(m.error.message)}
        </p>
      </div>
    `;

    return;

  }


  const historyMatches=
    m.data||[];


  const p=
    await supabase
      .from("predictions")
      .select("*");


  if(p.error){

    c.innerHTML=`
      <div class="card">
        <p class="danger">
          ${esc(p.error.message)}
        </p>
      </div>
    `;

    return;

  }


  const allPredictions=
    p.data||[];


  const playerTotals={};


  historyMatches.forEach(match=>{

    const hasActual=
      match.actual_home_score!=null &&
      match.actual_away_score!=null;


    if(!hasActual)
      return;


    allPredictions
      .filter(
        p=>p.match_id===match.id
      )
      .forEach(p=>{

        const pts=
          selectedRound.is_finished
          ?Number(p.points||0)
          :
          calculatePoints(
            p.predicted_home_score,
            p.predicted_away_score,
            p.predicted_outcome,
            match.actual_home_score,
            match.actual_away_score
          );


        if(pts!=null){

          playerTotals[p.user_id]=
            (playerTotals[p.user_id]||0)+
            Number(pts);

        }

      });

  });


  profiles.forEach(p=>{

    if(playerTotals[p.id]==null)
      playerTotals[p.id]=0;

  });


  const playerRows=
    profiles
      .map(p=>({

        id:p.id,

        name:p.name,

        points:
          playerTotals[p.id]||0

      }))
      .sort(
        (a,b)=>
          b.points-a.points
      );


  let html=`

    <div class="card">

      <h2>
        ${selectedRound.round_number}. kolo
      </h2>

      <p class="muted">

        ${
          selectedRound.is_finished
          ?"🏁 Kolo je završeno."
          :"🔒 Kolo još nije završeno."
        }

      </p>

      <div class="history-summary">

        <h3>
          Bodovi u kolu
        </h3>

  `;


  playerRows.forEach((p,i)=>{

    html+=`

      <div class="history-player">

        <span>
          <b>
            ${i+1}. ${esc(p.name)}
          </b>
        </span>

        <b>
          ${p.points} bod.
        </b>

      </div>

    `;

  });


  html+=`

      </div>

    </div>


    <div class="card">

      <h3>
        Utakmice i prognoze
      </h3>

  `;


  if(!historyMatches.length){

    html+=`
      <p class="muted">
        Ovo kolo nema utakmica.
      </p>
    `;

  }


  historyMatches.forEach(match=>{

    const hasActual=
      match.actual_home_score!=null &&
      match.actual_away_score!=null;


    const actual=
      hasActual
      ?`${match.actual_home_score}:${match.actual_away_score}`
      :"—";


    const matchPredictions=
      allPredictions.filter(
        p=>p.match_id===match.id
      );


    html+=`

      <div class="history-match">

        <div class="history-match-head">

          <span>
            ${esc(match.home_team)}
            –
            ${esc(match.away_team)}
          </span>

          <span>
            Stvarni rezultat:
            <b>${actual}</b>
          </span>

        </div>

        <div
          class="muted"
          style="font-size:13px;margin:4px 0 8px"
        >
          ${fmtDate(match.kickoff_at)}
        </div>

    `;


    if(matchPredictions.length){

      matchPredictions.forEach(p=>{

        let points="—";


        if(hasActual){

          points=
            calculatePoints(
              p.predicted_home_score,
              p.predicted_away_score,
              p.predicted_outcome,
              match.actual_home_score,
              match.actual_away_score
            );

        }


        if(
          points==null &&
          selectedRound.is_finished
        ){

          points=
            Number(p.points||0);

        }


        html+=`

          <div class="history-pred">

            <b>
              ${esc(nameById(p.user_id))}
            </b>

            :
            ${p.predicted_home_score}
            :
            ${p.predicted_away_score}

            · ishod
            ${esc(
              p.predicted_outcome||"-"
            )}

            ·

            <b>
              ${points??"—"} bod.
            </b>

          </div>

        `;

      });

    }
    else{

      html+=`

        <div class="muted">
          Nema prognoza za ovu utakmicu.
        </div>

      `;

    }


    html+=`

      </div>

    `;

  });


  html+=`

    </div>

  `;


  c.innerHTML=html;

}

async function saveAdminSchedule(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može uređivati raspored."
    );

    return;

  }


  if(!round||round.is_finished){

    toast(
      "Kolo je završeno."
    );

    return;

  }


  if(locked()){

    toast(
      "Kolo je već zaključano."
    );

    return;

  }


  const rows=
    Array.from(
      document.querySelectorAll(
        "#adminSchedule .admin-match"
      )
    );


  if(!rows.length){

    toast(
      "Dodaj barem jednu utakmicu."
    );

    return;

  }


  const data=[];


  for(const row of rows){

    const home=
      row
        .querySelector(".homeTeam")
        .value
        .trim();


    const away=
      row
        .querySelector(".awayTeam")
        .value
        .trim();


    const date=
      row
        .querySelector(".matchDate")
        .value;


    const time=
      row
        .querySelector(".matchTime")
        .value;


    if(!home||!away||!date||!time){

      toast(
        "Svaka utakmica mora imati domaćina, gosta, datum i vrijeme."
      );

      return;

    }


    if(home===away){

      toast(
        "Domaćin i gost ne mogu biti isti."
      );

      return;

    }


    const kickoff=
      toISO(date,time);


    if(!kickoff){

      toast(
        "Jedan od unesenih termina nije ispravan."
      );

      return;

    }


    data.push({
      row,
      home,
      away,
      kickoff
    });

  }


  for(const item of data){

    const id=
      item.row.dataset.mid;


    if(id){

      const {error}=
        await supabase
          .from("matches")
          .update({

            home_team:item.home,

            away_team:item.away,

            kickoff_at:item.kickoff,

            schedule_source:
              "admin",

            schedule_updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            id
          );


      if(error){

        toast(error.message);

        return;

      }

    }

  }


  for(const item of data){

    if(item.row.dataset.new!=="true")
      continue;


    const {error}=
      await supabase
        .from("matches")
        .insert({

          round_id:round.id,

          home_team:item.home,

          away_team:item.away,

          kickoff_at:item.kickoff,

          schedule_source:
            "admin",

          schedule_updated_at:
            new Date().toISOString()

        });


    if(error){

      toast(error.message);

      return;

    }

  }


  const allKickoffs=
    data.map(
      x=>x.kickoff
    );


  const newLockedAt=
    lockFromKickoffs(
      allKickoffs
    );


  if(newLockedAt){

    const {error}=
      await supabase
        .from("rounds")
        .update({
          locked_at:newLockedAt
        })
        .eq(
          "id",
          round.id
        );


    if(error){

      toast(error.message);

      return;

    }

  }


  await loadData();


  toast(
    "Raspored je spremljen."
  );


  showAdmin();

}

async function saveSingleResult(matchId){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može unositi rezultate."
    );

    return;

  }


  if(!round||round.is_finished){

    toast(
      "Kolo je već završeno."
    );

    return;

  }


  const row=
    document.querySelector(
      `.admin-result-box[data-mid="${matchId}"]`
    );


  if(!row){

    toast(
      "Utakmica nije pronađena."
    );

    return;

  }


  const h=
    row
      .querySelector(".ah")
      .value
      .trim();


  const a=
    row
      .querySelector(".aa")
      .value
      .trim();


  if(h===""||a===""){

    toast(
      "Unesi oba dijela rezultata."
    );

    return;

  }


  const homeScore=
    Number(h);


  const awayScore=
    Number(a);


  if(
    !Number.isInteger(homeScore) ||
    !Number.isInteger(awayScore) ||
    homeScore<0 ||
    awayScore<0 ||
    homeScore>30 ||
    awayScore>30
  ){

    toast(
      "Rezultat mora biti cijeli broj od 0 do 30."
    );

    return;

  }


  const button=
    row.querySelector(".save-result");


  if(button)
    button.disabled=true;


  const {error}=
    await supabase
      .from("matches")
      .update({

        actual_home_score:
          homeScore,

        actual_away_score:
          awayScore

      })
      .eq(
        "id",
        matchId
      );


  if(button)
    button.disabled=false;


  if(error){

    toast(
      "Spremanje rezultata nije uspjelo: "+
      error.message
    );

    return;

  }


  await loadData();


  toast(
    "Rezultat je spremljen."
  );


  showAdmin();

}

        Utakmica
      </div>

      <div class="admin-match-grid">

        <div>

          <label>
            Domaćin
          </label>

          <input
            class="newHome"
            placeholder="npr. Dinamo"
          >

            Gost
          </label>

          <input
            class="newAway"
            placeholder="npr. Hajduk"
          >

        </div>

          </label>

          >

/* =========================================
   ADMIN — KREIRAJ NOVO KOLO
========================================= */

async function createRound(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može napraviti novo kolo."
    );

    return;

  }


  const numberValue=
    document
      .getElementById(
        "newRoundNumber"
      )
      .value
      .trim();


  const roundNumber=
    Number(numberValue);


  if(
    !numberValue ||
    !Number.isInteger(roundNumber) ||
    roundNumber<1
  ){

    toast(
      "Unesi ispravan broj kola."
    );

    return;

  }


  const existing=
    await supabase
      .from("rounds")
      .select(
        "id,round_number"
      )
      .eq(
        "round_number",
        roundNumber
      )
      .maybeSingle();


  if(existing.error){

    toast(
      existing.error.message
    );

    return;

  }


  if(existing.data){

    toast(
      `${roundNumber}. kolo već postoji.`
    );

    return;

  }


  const rows=
    Array.from(
      document.querySelectorAll(
        "#newRoundMatches .new-round-row"
      )
    );


  if(!rows.length){

    toast(
      "Dodaj barem jednu utakmicu."
    );

    return;

  }


  const games=[];


  for(const row of rows){

    const home=
      row
        .querySelector(".newHome")
        .value
        .trim();


    const away=
      row
        .querySelector(".newAway")
        .value
        .trim();


    const date=
      row
        .querySelector(".newDate")
        .value;


    const time=
      row
        .querySelector(".newTime")
        .value;


    if(!home||!away||!date||!time){

      toast(
        "Svaka utakmica mora imati domaćina, gosta, datum i vrijeme."
      );

      return;

    }


    if(home===away){

      toast(
        "Domaćin i gost ne mogu biti isti."
      );

      return;

    }


    const kickoff=
      toISO(date,time);


    if(!kickoff){

      toast(
        "Jedan od termina nije ispravan."
      );

      return;

    }


    games.push({
      home,
      away,
      kickoff
    });

  }


  const lockedAt=
    lockFromKickoffs(
      games.map(
        x=>x.kickoff
      )
    );


  const createdRound=
    await supabase
      .from("rounds")
      .insert({

        round_number:
          roundNumber,

        locked_at:
          lockedAt,

        is_finished:
          false,

        is_published:
          false

      })
      .select("*")
      .single();


  if(createdRound.error){

    toast(
      createdRound.error.message
    );

    return;

  }


  const newRound=
    createdRound.data;


  for(const game of games){

    const {error}=
      await supabase
        .from("matches")
        .insert({

          round_id:
            newRound.id,

          home_team:
            game.home,

          away_team:
            game.away,

          kickoff_at:
            game.kickoff,

          schedule_source:
            "admin",

          schedule_updated_at:
            new Date().toISOString()

        });


    if(error){

      toast(
        "Kolo je napravljeno, ali utakmica nije spremljena: "+
        error.message
      );

      return;

    }

  }


  const published=
    await supabase
      .from("rounds")
      .update({
        is_published:true
      })
      .eq(
        "id",
        newRound.id
      );


  if(published.error){

    toast(
      "Kolo je spremljeno, ali objava nije uspjela: "+
      published.error.message
    );

    return;

  }


  await loadData();


  currentPage="admin";


  toast(
    `${roundNumber}. kolo je spremljeno i objavljeno.`
  );


  render();

}


/* =========================================
   ADMIN — RESET LOZINKE
========================================= */

async function adminResetPassword(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može resetirati lozinke."
    );

    return;

  }


  const userId=
    document
      .getElementById("resetPlayer")
      .value;


  const password=
    document
      .getElementById("temporaryPassword")
      .value
      .trim();


  const message=
    document
      .getElementById("resetMessage");


  if(!userId){

    message.textContent=
      "Odaberi igrača.";

    return;

  }


  if(password.length<6){

    message.textContent=
      "Privremena lozinka mora imati najmanje 6 znakova.";

    return;

  }


  const {
    data:{
      session
    }
  }=
    await supabase.auth.getSession();


  if(!session){

    message.textContent=
      "Sesija je istekla. Ponovno se prijavi.";

    return;

  }


  message.textContent=
    "Resetiranje lozinke...";


  try{

    const response=
      await fetch(
        SUPABASE_URL+
        "/functions/v1/admin-reset-password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              session.access_token
          },

          body:JSON.stringify({
            user_id:userId,
            temporary_password:password
          })
        }
      );


    const text=
      await response.text();


    let data={};


    try{

      data=
        JSON.parse(text);

    }
    catch{

      data={
        message:text
      };

    }


    if(!response.ok){

      message.textContent=
        data.error ||
        data.message ||
        "Resetiranje nije uspjelo.";

      return;

    }


    message.textContent=
      "Lozinka je resetirana. Igrač mora postaviti novu lozinku pri prvoj prijavi.";


    document
      .getElementById(
        "temporaryPassword"
      )
      .value="";


  }
  catch(e){

    console.error(e);

    message.textContent=
      "Greška pri povezivanju sa serverom.";

  }

}


/* =========================================
   ZAVRŠAVANJE KOLA
========================================= */

async function finishRound(){

  if(!profile?.is_admin){

    toast(
      "Samo administrator može završiti kolo."
    );

    return;

  }


  if(!round||round.is_finished){

    toast(
      "Kolo je već završeno."
    );

    return;

  }


  if(!matches.length){

    toast(
      "Nema utakmica za obračun."
    );

    return;

  }


  const updates=[];


  document
    .querySelectorAll(
      "#adminResults .admin-result-box"
    )
    .forEach(el=>{

      const h=
        el.querySelector(".ah").value;


      const a=
        el.querySelector(".aa").value;


      if(
        h!=="" &&
        a!==""
      ){

        updates.push({

          id:el.dataset.mid,

          actual_home_score:
            Number(h),

          actual_away_score:
            Number(a)

        });

      }

    });


  if(
    updates.length!==matches.length
  ){

    toast(
      "Unesi rezultat svih utakmica."
    );

    return;

  }


  for(const x of updates){

    const {error}=
      await supabase
        .from("matches")
        .update({

          actual_home_score:
            x.actual_home_score,

          actual_away_score:
            x.actual_away_score

        })
        .eq(
          "id",
          x.id
        );


    if(error){

      toast(error.message);

      return;

    }

  }


  const {error}=
    await supabase.rpc(
      "finish_round",
      {
        p_round_id:round.id
      }
    );


  if(error){

    toast(
      "Rezultati su spremljeni, ali obračun nije uspio: "+
      error.message
    );

    return;

  }


  toast(
    "Kolo je obračunato i završeno."
  );


  await loadData();


  currentPage="results";


  render();

}


/* =========================================
   POKRETANJE
========================================= */

async function boot(){

  try{

    const {data}=
      await supabase.auth.getSession();


    if(data.session){

      await start(
        data.session.user
      );

    }
    else{

      loginView();

    }

  }
  catch(e){

    console.error(e);

    loginView(
      "Aplikacija se nije mogla pokrenuti. Provjeri Supabase vezu."
    );

  }

}


supabase.auth.onAuthStateChange(
  (_event,session)=>{

    if(!session&&!user)
      loginView();

  }
);


boot();

</script>
